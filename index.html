<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Lab | Donanım & Performans Portalı</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.25);
            --nvidia: #76b900;
            --amd: #ed1d24;
            --intel: #0071c5;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            background-image: radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(118, 185, 0, 0.08) 0px, transparent 50%);
            min-height: 100vh;
            padding: 2rem;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1200px; margin: 0 auto 3rem auto; padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .logo { font-size: 1.8rem; font-weight: 800; color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); }
        .logo span { color: #fff; }

        .user-nav { display: flex; align-items: center; gap: 1rem; }
        .btn-auth {
            background: rgba(56, 189, 248, 0.1); color: var(--primary);
            border: 1px solid var(--primary); padding: 0.6rem 1.2rem;
            border-radius: 10px; font-weight: 700; text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-auth:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary-glow); }

        .container { max-width: 1200px; margin: 0 auto; display: grid; gap: 3rem; }

        .section-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; color: #fff; display: flex; align-items: center; gap: 0.5rem; }

        /* HIGH-END CHART TASARIMI */
        .chart-card {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chart-item {
            display: grid; grid-template-columns: 180px 1fr 80px; align-items: center; gap: 1rem;
            margin-bottom: 1rem; padding: 0.8rem; border-radius: 10px; background: rgba(255,255,255,0.02);
        }

        .chart-name { font-weight: 700; font-size: 0.95rem; }
        .chart-bar-bg { background: rgba(255,255,255,0.05); height: 12px; border-radius: 6px; overflow: hidden; position: relative; }
        .chart-bar-fill { height: 100%; border-radius: 6px; transition: width 1s ease-in-out; }
        .chart-score { font-weight: 800; text-align: right; color: var(--primary); }

        /* COLOR BRANDS */
        .brand-NVIDIA .chart-bar-fill { background: var(--nvidia); box-shadow: 0 0 10px rgba(118,185,0,0.5); }
        .brand-AMD .chart-bar-fill { background: var(--amd); box-shadow: 0 0 10px rgba(237,29,36,0.5); }
        .brand-Intel .chart-bar-fill { background: var(--intel); box-shadow: 0 0 10px rgba(0,113,197,0.5); }

        /* SİSTEM TOPLAMA PANELİ */
        .build-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .select-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .select-group label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
        select, input {
            background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            color: #fff; padding: 0.8rem; border-radius: 10px; outline: none; font-weight: 600;
        }
        select:focus, input:focus { border-color: var(--primary); }

        .btn-submit {
            background: var(--primary); color: #000; border: none; padding: 0.8rem 1.5rem;
            border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%;
            transition: all 0.2s ease;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>

    <header>
        <div class="logo">HARDWARE<span>LAB</span></div>
        <div class="user-nav" id="userNav">
            <a href="/auth/google" class="btn-auth">Google ile Giriş Yap</a>
        </div>
    </header>

    <div class="container">

        <!-- HIGH END BENCHMARK CHART -->
        <section>
            <div class="section-title">🔥 High-End Performans Sıralaması</div>
            <div class="chart-card" id="chartContainer">
                <!-- JavaScript ile yüklenecek -->
            </div>
        </section>

        <!-- SİSTEM TOPLAYICI (GELİŞMİŞ) -->
        <section>
            <div class="section-title">🖥️ Özel Sistem Toplayıcı</div>
            <div class="chart-card">
                <input type="text" id="buildTitle" placeholder="Sistem Adı (Örn: Canavar PC 2026)" style="width: 100%; margin-bottom: 1.5rem;">
                
                <div class="build-grid">
                    <div class="select-group">
                        <label>İşlemci (CPU)</label>
                        <select id="selectCpu"><option value="">Seçiniz...</option></select>
                    </div>
                    <div class="select-group">
                        <label>Ekran Kartı (GPU)</label>
                        <select id="selectGpu"><option value="">Seçiniz...</option></select>
                    </div>
                    <div class="select-group">
                        <label>Anakart (MOBO)</label>
                        <select id="selectMobo"><option value="">Seçiniz...</option></select>
                    </div>
                    <div class="select-group">
                        <label>Bellek (RAM)</label>
                        <select id="selectRam"><option value="">Seçiniz...</option></select>
                    </div>
                    <div class="select-group">
                        <label>Depolama (SSD)</label>
                        <select id="selectSsd"><option value="">Seçiniz...</option></select>
                    </div>
                    <div class="select-group">
                        <label>Güç Kaynağı (PSU)</label>
                        <select id="selectPsu"><option value="">Seçiniz...</option></select>
                    </div>
                </div>

                <button class="btn-submit" onclick="saveBuild()">Sistemi Kaydet</button>
            </div>
        </section>

    </div>

    <script>
        let allComponents = [];

        async function init() {
            // Kullanıcı Durumu
            try {
                const resUser = await fetch('/api/me');
                if(resUser.ok) {
                    const user = await resUser.json();
                    document.getElementById('userNav').innerHTML = `
                        <span style="font-weight:700;">${user.name}</span>
                        <a href="/logout" class="btn-auth" style="border-color:#ef4444; color:#ef4444;">Çıkış</a>
                    `;
                }
            } catch(e) {}

            // Donanımları Yükle
            const res = await fetch('/api/components');
            if(res.ok) {
                allComponents = await res.json();
                renderChart();
                populateDropdowns();
            }
        }

        function renderChart() {
            const chart = document.getElementById('chartContainer');
            // En yüksek skorlu ilk 8 donanımı chart yap
            const topHardware = allComponents.slice(0, 8);

            chart.innerHTML = topHardware.map(item => `
                <div class="chart-item brand-${item.brand}">
                    <div class="chart-name">${item.brand} ${item.model}</div>
                    <div class="chart-bar-bg">
                        <div class="chart-bar-fill" style="width: ${item.score}%"></div>
                    </div>
                    <div class="chart-score">${item.score} Pts</div>
                </div>
            `).join('');
        }

        function populateDropdowns() {
            const fillSelect = (id, type) => {
                const el = document.getElementById(id);
                const items = allComponents.filter(c => c.type === type);
                el.innerHTML = '<option value="">Seçiniz...</option>' + 
                    items.map(i => `<option value="${i.id}">${i.brand} ${i.model} (${i.specs})</option>`).join('');
            };

            fillSelect('selectCpu', 'cpu');
            fillSelect('selectGpu', 'gpu');
            fillSelect('selectMobo', 'mobo');
            fillSelect('selectRam', 'ram');
            fillSelect('selectSsd', 'ssd');
            fillSelect('selectPsu', 'psu');
        }

        async function saveBuild() {
            const title = document.getElementById('buildTitle').value;
            const cpu_id = document.getElementById('selectCpu').value;
            const gpu_id = document.getElementById('selectGpu').value;
            const mobo_id = document.getElementById('selectMobo').value;
            const ram_id = document.getElementById('selectRam').value;
            const ssd_id = document.getElementById('selectSsd').value;
            const psu_id = document.getElementById('selectPsu').value;

            if(!title || !cpu_id || !gpu_id) {
                alert("Lütfen en azından Sistem Adı, İşlemci ve Ekran Kartı seçin!");
                return;
            }

            const res = await fetch('/api/builds', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    title, 
                    cpu_id: parseInt(cpu_id), 
                    gpu_id: parseInt(gpu_id),
                    mobo_id: parseInt(mobo_id) || 0,
                    ram_id: parseInt(ram_id) || 0,
                    ssd_id: parseInt(ssd_id) || 0,
                    psu_id: parseInt(psu_id) || 0
                })
            });

            if(res.ok) {
                alert("Sisteminiz başarıyla kaydedildi!");
                location.reload();
            } else {
                alert("Sistem kaydetmek için giriş yapmalısınız.");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
