<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Benchmark & System Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(22, 30, 49, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --accent-purple: #c084fc;
            --accent-green: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 8px 0;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .auth-container {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-google {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #ffffff;
            color: #0f172a;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.7);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(8px);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }

        .user-name {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.9rem;
        }

        .btn-logout {
            color: #f87171;
            text-decoration: none;
            font-size: 0.8rem;
            margin-left: 8px;
            padding-left: 8px;
            border-left: 1px solid var(--card-border);
            font-weight: 600;
        }

        .main-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            background: rgba(15, 23, 42, 0.6);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .main-tab-btn {
            flex: 1;
            padding: 12px 16px;
            font-size: 13px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
        }

        .main-tab-btn.active {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 25px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .box h2 {
            margin-top: 0;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .inputs {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        input, select, textarea {
            flex: 1;
            min-width: 150px;
            padding: 14px 18px;
            font-size: 14px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background-color: rgba(10, 15, 29, 0.8);
            color: #ffffff;
            font-family: inherit;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        button.action-btn {
            padding: 12px 20px;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        }

        button.action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .item-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            padding: 18px;
            border-radius: 14px;
            margin-top: 12px;
        }

        .item-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            align-items: center; justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 20px;
            width: 90%; max-width: 480px;
        }

        .reviews-list {
            max-height: 220px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .review-item {
            border-bottom: 1px solid var(--card-border);
            padding: 10px 0;
            font-size: 0.88rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="logo-title">Hardware Lab</h1>
        <p class="subtitle">Ekran Kartı ve İşlemci Benchmark & Karşılaştırma</p>
        
        <div id="authContainer" class="auth-container">
            <!-- Oturum Durumu JS ile Yönetilir -->
        </div>
    </header>

    <!-- Ana Sekmeler -->
    <div class="main-tabs">
        <button class="main-tab-btn active" id="btnGpuTab" onclick="openTab('gpuTab', 'btnGpuTab')">🎮 Ekran Kartları</button>
        <button class="main-tab-btn" id="btnCpuTab" onclick="openTab('cpuTab', 'btnCpuTab')">⚡ İşlemciler</button>
        <button class="main-tab-btn" id="btnCompareTab" onclick="openTab('compareTab', 'btnCompareTab')">⚔️ Karşılaştırma</button>
    </div>

    <!-- GPU Sekmesi -->
    <div id="gpuTab" class="tab-content">
        <div class="box">
            <h2>🎮 Ekran Kartı Listesi</h2>
            <div id="gpuList">
                <p style="color:var(--text-muted);">Yükleniyor...</p>
            </div>
        </div>
    </div>

    <!-- CPU Sekmesi -->
    <div id="cpuTab" class="tab-content" style="display: none;">
        <div class="box">
            <h2>⚡ İşlemci Listesi</h2>
            <div id="cpuList">
                <p style="color:var(--text-muted);">Yükleniyor...</p>
            </div>
        </div>
    </div>

    <!-- Karşılaştırma Sekmesi -->
    <div id="compareTab" class="tab-content" style="display: none;">
        <div class="box">
            <h2>⚔️ Donanım Karşılaştır</h2>
            <div class="inputs">
                <select id="compCategory" onchange="updateDropdowns()">
                    <option value="gpu">🎮 Ekran Kartı Karşılaştır</option>
                    <option value="cpu">⚡ İşlemci Karşılaştır</option>
                </select>
                <select id="item1Select"><option value="">1. Parça</option></select>
                <select id="item2Select"><option value="">2. Parça</option></select>
                <button class="action-btn" onclick="runCompare()">Karşılaştır</button>
            </div>
            <div id="compareResult"></div>
        </div>
    </div>
</div>

<!-- Yorum ve Yıldız Modalı -->
<div id="reviewModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin-top: 0; color: var(--primary);">Yorumlar</h3>
        <input type="hidden" id="modalType">
        <input type="hidden" id="modalId">

        <div id="reviewFormArea"></div>

        <div class="reviews-list" id="reviewsContainer"></div>
        <button class="action-btn" style="margin-top: 15px; width: 100%; background: #334155;" onclick="closeModal()">Kapat</button>
    </div>
</div>

<script>
let gpus = [];
let cpus = [];

document.addEventListener('DOMContentLoaded', async () => {
    await checkUser();
    await fetchHardware();
});

async function checkUser() {
    try {
        const res = await fetch('/api/me');
        const data = await res.json();
        const authDiv = document.getElementById('authContainer');

        if (data.authenticated) {
            authDiv.innerHTML = `
                <div class="user-profile">
                    <img src="${data.user.picture}" class="user-avatar" alt="">
                    <span class="user-name">${data.user.name}</span>
                    <a href="/logout" class="btn-logout">Çıkış Yap</a>
                </div>
            `;
        } else {
            authDiv.innerHTML = `
                <a href="/login/google" class="btn-google">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    Google ile Giriş Yap
                </a>
            `;
        }
    } catch(e) { console.error(e); }
}

async function fetchHardware() {
    try {
        const [rGpu, rCpu] = await Promise.all([fetch('/api/gpus'), fetch('/api/cpus')]);
        gpus = await rGpu.json();
        cpus = await rCpu.json();

        renderGpus();
        renderCpus();
        updateDropdowns();
    } catch (e) {
        console.error("Veri çekilemedi:", e);
    }
}

function renderGpus() {
    const list = document.getElementById('gpuList');
    if (!gpus || gpus.length === 0) {
        list.innerHTML = `<p style="color:var(--text-muted);">Henüz ekran kartı eklenmemiş.</p>`;
        return;
    }
    list.innerHTML = gpus.map(g => `
        <div class="item-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0; color:#fff; font-size:1.05rem;">${g.isim}</h3>
                <span style="color:var(--primary); font-weight:800;">${g.puan} Puan</span>
            </div>
            <p style="color:var(--text-muted); font-size:0.85rem; margin:8px 0;">VRAM: ${g.vram} | F/P: ${g.fiyat_performans}</p>
            <button class="action-btn" style="padding: 6px 12px; font-size:0.78rem;" onclick="openReviewModal('gpu', ${g.id}, '${g.isim}')">⭐ Yorum Yap & Puan Ver</button>
        </div>
    `).join('');
}

function renderCpus() {
    const list = document.getElementById('cpuList');
    if (!cpus || cpus.length === 0) {
        list.innerHTML = `<p style="color:var(--text-muted);">Henüz işlemci eklenmemiş.</p>`;
        return;
    }
    list.innerHTML = cpus.map(c => `
        <div class="item-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0; color:#fff; font-size:1.05rem;">${c.isim}</h3>
                <span style="color:var(--accent-purple); font-weight:800;">${c.puan} Puan</span>
            </div>
            <p style="color:var(--text-muted); font-size:0.85rem; margin:8px 0;">Çekirdek: ${c.cekirdek} | F/P: ${c.fiyat_performans}</p>
            <button class="action-btn" style="padding: 6px 12px; font-size:0.78rem;" onclick="openReviewModal('cpu', ${c.id}, '${c.isim}')">⭐ Yorum Yap & Puan Ver</button>
        </div>
    `).join('');
}

function updateDropdowns() {
    const cat = document.getElementById('compCategory').value;
    const items = cat === 'gpu' ? gpus : cpus;
    const s1 = document.getElementById('item1Select');
    const s2 = document.getElementById('item2Select');

    s1.innerHTML = items.map(i => `<option value="${i.isim}">${i.isim}</option>`).join('');
    s2.innerHTML = items.map(i => `<option value="${i.isim}">${i.isim}</option>`).join('');
}

async function runCompare() {
    const cat = document.getElementById('compCategory').value;
    const i1 = document.getElementById('item1Select').value;
    const i2 = document.getElementById('item2Select').value;

    if (!i1 || !i2) return;

    const url = cat === 'gpu' ? `/api/karsilastir?gpu1=${i1}&gpu2=${i2}` : `/api/karsilastir/cpu?cpu1=${i1}&cpu2=${i2}`;
    const res = await fetch(url);
    if (res.ok) {
        const d = await res.json();
        const o1 = d.kart_1 || d.cpu_1;
        const o2 = d.kart_2 || d.cpu_2;

        document.getElementById('compareResult').innerHTML = `
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:15px;">
                <div class="item-card">
                    <h4 style="margin:0 0 8px 0;">${o1.isim}</h4>
                    <p style="margin:0; font-size:0.9rem;">Puan: <strong>${o1.puan}</strong></p>
                </div>
                <div class="item-card">
                    <h4 style="margin:0 0 8px 0;">${o2.isim}</h4>
                    <p style="margin:0; font-size:0.9rem;">Puan: <strong>${o2.puan}</strong></p>
                </div>
            </div>
            <div style="text-align:center; margin-top:12px; color:var(--accent-green); font-weight:bold;">
                🏆 Kazanan: ${d.kazanan} (${d.puan_farki} Puan Fark)
            </div>
        `;
    }
}

function openTab(tabId, btnId) {
    document.querySelectorAll('.tab-content').forEach(e => e.style.display = 'none');
    document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));

    document.getElementById(tabId).style.display = 'block';
    document.getElementById(btnId).classList.add('active');
}

async function openReviewModal(type, id, name) {
    document.getElementById('modalType').value = type;
    document.getElementById('modalId').value = id;
    document.getElementById('modalTitle').innerText = name + " - Yorumlar";

    const authRes = await fetch('/api/me');
    const authData = await authRes.json();
    const formArea = document.getElementById('reviewFormArea');

    if(authData.authenticated) {
        formArea.innerHTML = `
            <div style="margin-bottom:8px;">
                <select id="modalStars" style="padding:6px;"><option value="5">⭐⭐⭐⭐⭐ 5</option><option value="4">⭐⭐⭐⭐ 4</option><option value="3">⭐⭐⭐ 3</option></select>
            </div>
            <textarea id="modalComment" placeholder="Yorumunuz..." style="width:100%; height:50px; margin-bottom:8px;"></textarea>
            <button class="action-btn" style="width:100%;" onclick="sendReview()">Gönder</button>
        `;
    } else {
        formArea.innerHTML = `<p style="color:#fbbf24; font-size:0.85rem;">Yorum yapmak için Google ile giriş yapmalısınız.</p>`;
    }

    await loadReviews(type, id);
    document.getElementById('reviewModal').style.display = 'flex';
}

async function loadReviews(type, id) {
    const res = await fetch(`/api/yorumlar/${type}/${id}`);
    const reviews = await res.json();
    const container = document.getElementById('reviewsContainer');
    
    if(reviews.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); font-size:0.85rem;">Henüz yorum yapılmadı.</p>`;
        return;
    }

    container.innerHTML = reviews.map(r => `
        <div class="review-item">
            <div style="display:flex; justify-content:space-between;">
                <strong style="color:var(--primary);">${r.user_name}</strong>
                <span style="color:#f59e0b;">⭐ ${r.yildiz}/5</span>
            </div>
            <p style="margin:4px 0 0 0; color:#e2e8f0;">${r.yorum}</p>
        </div>
    `).join('');
}

async function sendReview() {
    const type = document.getElementById('modalType').value;
    const id = document.getElementById('modalId').value;
    const yildiz = document.getElementById('modalStars').value;
    const yorum = document.getElementById('modalComment').value;

    const formData = new FormData();
    formData.append('parca_tipi', type);
    formData.append('parca_id', id);
    formData.append('yildiz', yildiz);
    formData.append('yorum', yorum);

    const res = await fetch('/api/yorum-ekle', { method: 'POST', body: formData });
    if(res.ok) {
        document.getElementById('modalComment').value = '';
        loadReviews(type, id);
    }
}

function closeModal() {
    document.getElementById('reviewModal').style.display = 'none';
}
</script>
</body>
</html>
