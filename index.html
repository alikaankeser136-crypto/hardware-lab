<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Lab - Benchmark & FPS Analiz</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent-color: #38bdf8;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        .logo-title {
            font-size: 2.2rem;
            margin: 0;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        /* Google Auth Alanı */
        .auth-container {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-google {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #ffffff;
            color: #1f2937;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(31, 41, 55, 0.6);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
        }

        .user-name {
            font-weight: 600;
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        .btn-logout {
            color: #f87171;
            text-decoration: none;
            font-size: 0.8rem;
            margin-left: 8px;
            padding-left: 8px;
            border-left: 1px solid var(--card-border);
        }

        .btn-logout:hover {
            text-decoration: underline;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media(min-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card-full {
            grid-column: 1 / -1;
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background-color: #1f2937;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .action-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }

        .action-btn:hover {
            background-color: #0284c7;
            color: #fff;
        }

        .result-box {
            margin-top: 15px;
            padding: 12px;
            background-color: rgba(31, 41, 55, 0.5);
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }

        ul {
            margin: 5px 0 0 0;
            padding-left: 20px;
        }

        li {
            margin-bottom: 4px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 class="logo-title">HARDWARE LAB</h1>
            <p class="subtitle">Benchmark, Çözünürlüklü FPS & Sistem Gereksinim Analizörü</p>

            <!-- Google OAuth Login Alanı -->
            <div class="auth-container">
                <a href="/login/google" id="loginBtn" class="btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google Logo">
                    Google ile Giriş Yap
                </a>

                <div id="userInfo" class="user-profile" style="display: none;">
                    <img id="userAvatar" class="user-avatar" src="" alt="User Avatar">
                    <span id="userName" class="user-name"></span>
                    <a href="/logout" class="btn-logout">Çıkış</a>
                </div>
            </div>
        </header>

        <div class="grid-container">
            <!-- 1. FPS Tahmin Kartı -->
            <div class="card">
                <h2>🎮 FPS Tahmini</h2>
                <div class="form-group">
                    <label for="fpsGpu">Ekran Kartı</label>
                    <input type="text" id="fpsGpu" placeholder="Örn: RTX 2060, GTX 1060...">
                </div>
                <div class="form-group">
                    <label for="fpsRes">Çözünürlük</label>
                    <select id="fpsRes">
                        <option value="1080p">1080p (FHD)</option>
                        <option value="1440p">1440p (2K)</option>
                        <option value="4k">4K (2160p)</option>
                    </select>
                </div>
                <button class="action-btn" onclick="calculateFps()">FPS Hesapla</button>
                <div id="fpsResult" class="result-box"></div>
            </div>

            <!-- 2. Kart Karşılaştırma Kartı -->
            <div class="card">
                <h2>⚔️ GPU Karşılaştırma</h2>
                <div class="form-group">
                    <label for="compGpu1">1. Ekran Kartı</label>
                    <input type="text" id="compGpu1" placeholder="Örn: RTX 3060">
                </div>
                <div class="form-group">
                    <label for="compGpu2">2. Ekran Kartı</label>
                    <input type="text" id="compGpu2" placeholder="Örn: RX 6600">
                </div>
                <button class="action-btn" onclick="compareGpus()">Karşılaştır</button>
                <div id="compResult" class="result-box"></div>
            </div>

            <!-- 3. Can I Run It Kartı -->
            <div class="card card-full">
                <h2>🔍 Kaldırır Mı? (Can I Run It)</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                    <div class="form-group">
                        <label for="runGpu">Ekran Kartı</label>
                        <input type="text" id="runGpu" placeholder="Örn: RTX 2060">
                    </div>
                    <div class="form-group">
                        <label for="runCpu">İşlemci</label>
                        <input type="text" id="runCpu" placeholder="Örn: i7-10750H">
                    </div>
                    <div class="form-group">
                        <label for="runRam">RAM (GB)</label>
                        <input type="number" id="runRam" value="16">
                    </div>
                    <div class="form-group">
                        <label for="runGame">Oyun</label>
                        <select id="runGame">
                            <option value="valorant">Valorant</option>
                            <option value="cs2">CS2</option>
                            <option value="cyberpunk">Cyberpunk 2077</option>
                            <option value="gtav">GTA V</option>
                            <option value="rdr2">Red Dead Redemption 2</option>
                        </select>
                    </div>
                </div>
                <button class="action-btn" onclick="checkCanIRun()">Sistemi Test Et</button>
                <div id="runResult" class="result-box"></div>
            </div>
        </div>
    </div>

    <script>
        // Google Session Kullanıcı Kontrolü
        async function checkUserSession() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                const loginBtn = document.getElementById('loginBtn');
                const userInfo = document.getElementById('userInfo');

                if (data.authenticated) {
                    loginBtn.style.display = 'none';
                    userInfo.style.display = 'flex';
                    document.getElementById('userName').innerText = data.user.name || data.user.email;
                    document.getElementById('userAvatar').src = data.user.picture || 'https://via.placeholder.com/32';
                } else {
                    loginBtn.style.display = 'inline-flex';
                    userInfo.style.display = 'none';
                }
            } catch (err) {
                console.error("Session hatası:", err);
            }
        }
        checkUserSession();

        // 1. FPS Hesaplama
        async function calculateFps() {
            const gpu = document.getElementById('fpsGpu').value;
            const res = document.getElementById('fpsRes').value;
            const resBox = document.getElementById('fpsResult');

            if (!gpu) { alert("Lütfen bir ekran kartı yazın."); return; }

            resBox.style.display = 'block';
            resBox.innerHTML = "Hesaplanıyor...";

            try {
                const response = await fetch(`/api/fps/${encodeURIComponent(gpu)}?res=${res}`);
                if (!response.ok) {
                    resBox.innerHTML = "<span style='color: #f87171;'>Kart bulunamadı!</span>";
                    return;
                }
                const data = await response.json();
                let html = `<strong>${data.kart} (${data.cozunurluk}) Tahmini FPS:</strong><ul>`;
                for (const [game, fps] of Object.entries(data.oyunlar)) {
                    html += `<li><strong>${game}:</strong> ${fps}</li>`;
                }
                html += "</ul>";
                resBox.innerHTML = html;
            } catch (e) {
                resBox.innerHTML = "<span style='color: #f87171;'>Bir hata oluştu.</span>";
            }
        }

        // 2. GPU Karşılaştırma
        async function compareGpus() {
            const g1 = document.getElementById('compGpu1').value;
            const g2 = document.getElementById('compGpu2').value;
            const resBox = document.getElementById('compResult');

            if (!g1 || !g2) { alert("Lütfen iki kartı da girin."); return; }

            resBox.style.display = 'block';
            resBox.innerHTML = "Karşılaştırılıyor...";

            try {
                const response = await fetch(`/api/karsilastir?gpu1=${encodeURIComponent(g1)}&gpu2=${encodeURIComponent(g2)}`);
                if (!response.ok) {
                    resBox.innerHTML = "<span style='color: #f87171;'>Kartlardan biri veya ikisi bulunamadı.</span>";
                    return;
                }
                const data = await response.json();
                resBox.innerHTML = `
                    <strong>Kazanan:</strong> <span style="color: #38bdf8">${data.kazanan}</span> (${data.yuzde_fark})<br>
                    <hr style="border-color: var(--card-border); margin: 8px 0;">
                    • ${data.kart_1.isim}: ${data.kart_1.puan} Puan<br>
                    • ${data.kart_2.isim}: ${data.kart_2.puan} Puan
                `;
            } catch (e) {
                resBox.innerHTML = "<span style='color: #f87171;'>Bir hata oluştu.</span>";
            }
        }

        // 3. Can I Run It
        async function checkCanIRun() {
            const gpu = document.getElementById('runGpu').value;
            const cpu = document.getElementById('runCpu').value;
            const ram = document.getElementById('runRam').value;
            const game = document.getElementById('runGame').value;
            const resBox = document.getElementById('runResult');

            if (!gpu || !cpu || !ram) { alert("Lütfen tüm alanları doldurun."); return; }

            resBox.style.display = 'block';
            resBox.innerHTML = "Test ediliyor...";

            try {
                const response = await fetch(`/api/can-i-run?gpu=${encodeURIComponent(gpu)}&cpu=${encodeURIComponent(cpu)}&ram=${ram}&game=${game}`);
                if (!response.ok) {
                    resBox.innerHTML = "<span style='color: #f87171;'>Bileşenler veya oyun veritabanında bulunamadı.</span>";
                    return;
                }
                const data = await response.json();
                let detHtml = "<ul>";
                data.detaylar.forEach(d => detHtml += `<li>${d}</li>`);
                detHtml += "</ul>";

                resBox.innerHTML = `
                    <strong>Oyun:</strong> ${data.oyun}<br>
                    <strong>Durum:</strong> <span class="badge" style="background-color: ${data.renk}; color: #000;">${data.durum}</span>
                    ${detHtml}
                `;
            } catch (e) {
                resBox.innerHTML = "<span style='color: #f87171;'>Bir hata oluştu.</span>";
            }
        }
    </script>
</body>
</html>
