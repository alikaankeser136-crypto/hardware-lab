<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Lab | Benchmark & Donanım Karşılaştırma</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-bright: #ffffff;
            --accent-blue: #58a6ff;
            --accent-green: #2ea043;
            --accent-gold: #d29922;
            --hover-color: #1f242d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .logo h1 {
            color: var(--text-bright);
            font-size: 24px;
        }

        .auth-status {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--accent-blue);
        }

        .btn {
            background-color: var(--accent-blue);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-success {
            background-color: var(--accent-green);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .card h2 {
            color: var(--text-bright);
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        select, input, textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-bright);
            border-radius: 6px;
            outline: none;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .compare-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .compare-result {
            background-color: var(--hover-color);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .rating-stars {
            color: var(--accent-gold);
            font-size: 18px;
            margin-bottom: 5px;
        }

        .review-item {
            border-bottom: 1px solid var(--border-color);
            padding: 10px 0;
        }

        .review-item:last-child {
            border-bottom: none;
        }

        .review-author {
            color: var(--text-bright);
            font-weight: 600;
            font-size: 13px;
        }

        .badge-lock {
            background-color: #21262d;
            color: #8b949e;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>Hardware Lab</h1>
        </div>
        <div class="auth-status" id="authContainer">
            <!-- JavaScript oturum durumuna göre burayı dolduracak -->
            <a href="/auth/google" class="btn">Google ile Giriş Yap</a>
        </div>
    </header>

    <!-- 1. DÖŞEME: İşlemci ve Ekran Kartı Karşılaştırma Modülü -->
    <section class="card" style="margin-bottom: 25px;">
        <h2>İşlemci / GPU Karşılaştırma</h2>
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px;">
                <label for="compType">Kategori</label>
                <select id="compType" onchange="loadCompareOptions()">
                    <option value="cpu">İşlemci (CPU)</option>
                    <option value="gpu">Ekran Kartı (GPU)</option>
                </select>
            </div>
            <div style="flex: 1; min-width: 200px;">
                <label for="comp1">1. Donanım</label>
                <select id="comp1"></select>
            </div>
            <div style="flex: 1; min-width: 200px;">
                <label for="comp2">2. Donanım</label>
                <select id="comp2"></select>
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button class="btn" onclick="executeCompare()">Karşılaştır</button>
            </div>
        </div>

        <div id="compareResults" class="compare-box" style="display: none;">
            <div class="compare-result" id="res1"></div>
            <div class="compare-result" id="res2"></div>
        </div>
    </section>

    <div class="grid-container">
        
        <!-- 2. DÖŞEME: Sistem Toplama (PC Builder) Modülü -->
        <div class="card">
            <h2>Kendi Sistemini Topla</h2>
            <div id="builderAuthLock" class="badge-lock" style="display: none; margin-bottom: 15px;">
                Sistem kaydedebilmek için Google ile giriş yapmalısınız.
            </div>
            <div class="form-group">
                <label for="buildTitle">Sistem Adı</label>
                <input type="text" id="buildTitle" placeholder="Örn: Oyun Bilgisayarım 2026">
            </div>
            <div class="form-group">
                <label for="buildCpu">İşlemci Seç</label>
                <select id="buildCpu"></select>
            </div>
            <div class="form-group">
                <label for="buildGpu">Ekran Kartı Seç</label>
                <select id="buildGpu"></select>
            </div>
            <button class="btn btn-success" style="width: 100%;" onclick="saveBuild()">Sistemi Kaydet</button>

            <div style="margin-top: 20px;">
                <h3 style="font-size: 14px; color: var(--text-bright); margin-bottom: 10px;">Kaydedilen Sistemlerim</h3>
                <div id="myBuildsList"></div>
            </div>
        </div>

        <!-- 3. DÖŞEME: Yorum Yapma & Puan Verme Modülü -->
        <div class="card">
            <h2>Donanım Değerlendirme & Yorum</h2>
            
            <div id="reviewAuthLock" class="badge-lock" style="display: none; margin-bottom: 15px;">
                Yorum yapabilmek ve puan verebilmek için Google hesabınızla giriş yapın.
            </div>

            <form id="reviewForm" onsubmit="submitReview(event)">
                <div class="form-group">
                    <label for="reviewComponent">Donanım Seç</label>
                    <select id="reviewComponent"></select>
                </div>
                <div class="form-group">
                    <label for="reviewRating">Puanınız</label>
                    <select id="reviewRating">
                        <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                        <option value="4">⭐⭐⭐⭐ (4/5)</option>
                        <option value="3">⭐⭐⭐ (3/5)</option>
                        <option value="2">⭐⭐ (2/5)</option>
                        <option value="1">⭐ (1/5)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reviewComment">Yorumunuz</label>
                    <textarea id="reviewComment" placeholder="Donanım performansı hakkında fikirlerinizi yazın..." required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;" id="btnReviewSubmit">Yorumu Gönder</button>
            </form>

            <div style="margin-top: 20px;">
                <h3 style="font-size: 14px; color: var(--text-bright); margin-bottom: 10px;">Son Değerlendirmeler</h3>
                <div id="reviewsList"></div>
            </div>
        </div>

    </div>

    <script>
        let currentUser = null;
        let componentsData = [];

        // Sayfa yüklendiğinde çalışacak başlatıcı
        async function init() {
            await checkAuth();
            await fetchComponents();
            loadCompareOptions();
            loadUserBuilds();
            loadReviews();
        }

        // Oturum Kontrolü (FastAPI /api/me veya session yapınıza bağlıdır)
        async function checkAuth() {
            try {
                const res = await fetch('/api/me');
                if (res.ok) {
                    currentUser = await res.json();
                    renderAuthUser();
                } else {
                    renderAuthGuest();
                }
            } catch (e) {
                renderAuthGuest();
            }
        }

        function renderAuthUser() {
            document.getElementById('authContainer').innerHTML = `
                <img src="${currentUser.picture || 'https://via.placeholder.com/36'}" class="user-avatar" alt="Profil">
                <span style="color: var(--text-bright); font-weight: 500;">${currentUser.name}</span>
                <a href="/logout" class="btn" style="background-color: #21262d;">Çıkış</a>
            `;
            document.getElementById('reviewAuthLock').style.display = 'none';
            document.getElementById('builderAuthLock').style.display = 'none';
        }

        function renderAuthGuest() {
            document.getElementById('authContainer').innerHTML = `
                <a href="/auth/google" class="btn">Google ile Giriş Yap</a>
            `;
            document.getElementById('reviewAuthLock').style.display = 'block';
            document.getElementById('builderAuthLock').style.display = 'block';
            
            // Giriş yapılmadıysa form alanlarını kısıtla
            document.getElementById('btnReviewSubmit').disabled = true;
            document.getElementById('btnReviewSubmit').style.opacity = '0.5';
        }

        // Donanımları Çekme ve Seçim Kutularını Doldurma
        async function fetchComponents() {
            try {
                const res = await fetch('/api/components');
                if (res.ok) {
                    componentsData = await res.json();
                    populateDropdowns();
                }
            } catch (e) {
                console.error("Donanım listesi çekilemedi:", e);
            }
        }

        function populateDropdowns() {
            const buildCpu = document.getElementById('buildCpu');
            const buildGpu = document.getElementById('buildGpu');
            const reviewComp = document.getElementById('reviewComponent');

            buildCpu.innerHTML = '';
            buildGpu.innerHTML = '';
            reviewComp.innerHTML = '';

            componentsData.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.textContent = `${item.brand} ${item.model}`;

                if (item.type === 'cpu') buildCpu.appendChild(opt.cloneNode(true));
                if (item.type === 'gpu') buildGpu.appendChild(opt.cloneNode(true));
                reviewComp.appendChild(opt.cloneNode(true));
            });
        }

        // Karşılaştırma Seçeneklerini Güncelleme
        function loadCompareOptions() {
            const type = document.getElementById('compType').value;
            const comp1 = document.getElementById('comp1');
            const comp2 = document.getElementById('comp2');

            comp1.innerHTML = '';
            comp2.innerHTML = '';

            const filtered = componentsData.filter(c => c.type === type);
            filtered.forEach(item => {
                const opt1 = new Option(`${item.brand} ${item.model}`, item.id);
                const opt2 = new Option(`${item.brand} ${item.model}`, item.id);
                comp1.add(opt1);
                comp2.add(opt2);
            });
            if (comp2.options.length > 1) comp2.selectedIndex = 1;
        }

        // Karşılaştırma İşlemi
        async function executeCompare() {
            const id1 = document.getElementById('comp1').value;
            const id2 = document.getElementById('comp2').value;

            if (!id1 || !id2) return;

            const res = await fetch(`/api/compare?comp1_id=${id1}&comp2_id=${id2}`);
            if (res.ok) {
                const data = await res.json();
                if (data.length >= 2) {
                    document.getElementById('compareResults').style.display = 'grid';
                    document.getElementById('res1').innerHTML = `
                        <h3 style="color:var(--accent-blue)">${data[0].brand} ${data[0].model}</h3>
                        <p style="margin-top:8px;"><strong>Skor:</strong> ${data[0].score}</p>
                    `;
                    document.getElementById('res2').innerHTML = `
                        <h3 style="color:var(--accent-blue)">${data[1].brand} ${data[1].model}</h3>
                        <p style="margin-top:8px;"><strong>Skor:</strong> ${data[1].score}</p>
                    `;
                }
            }
        }

        // Yorum Gönderme
        async function submitReview(e) {
            e.preventDefault();
            if (!currentUser) {
                alert("Yorum yapabilmek için Google ile giriş yapmalısınız.");
                return;
            }

            const body = {
                component_id: parseInt(document.getElementById('reviewComponent').value),
                rating: parseInt(document.getElementById('reviewRating').value),
                comment: document.getElementById('reviewComment').value
            };

            const res = await fetch('/api/reviews', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                document.getElementById('reviewComment').value = '';
                loadReviews();
            } else {
                alert("Yorum kaydedilemedi.");
            }
        }

        // Yorumları Listeleme
        async function loadReviews() {
            const res = await fetch('/api/reviews');
            if (res.ok) {
                const list = await res.json();
                const container = document.getElementById('reviewsList');
                container.innerHTML = '';
                list.forEach(r => {
                    container.innerHTML += `
                        <div class="review-item">
                            <div class="review-author">${r.user_name || 'Kullanıcı'}</div>
                            <div class="rating-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
                            <p style="font-size: 13px;">${r.comment}</p>
                        </div>
                    `;
                });
            }
        }

        // Sistem Kaydetme
        async function saveBuild() {
            if (!currentUser) {
                alert("Sisteminizi kaydedebilmek için Google ile giriş yapmalısınız.");
                return;
            }

            const title = document.getElementById('buildTitle').value;
            if (!title) {
                alert("Lütfen sisteminiz için bir isim girin.");
                return;
            }

            const body = {
                title: title,
                cpu_id: parseInt(document.getElementById('buildCpu').value),
                gpu_id: parseInt(document.getElementById('buildGpu').value)
            };

            const res = await fetch('/api/builds', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                document.getElementById('buildTitle').value = '';
                loadUserBuilds();
            }
        }

        // Kullanıcı Sistemlerini Yükleme
        async function loadUserBuilds() {
            if (!currentUser) return;
            const res = await fetch('/api/my-builds');
            if (res.ok) {
                const builds = await res.json();
                const container = document.getElementById('myBuildsList');
                container.innerHTML = '';
                builds.forEach(b => {
                    container.innerHTML += `
                        <div style="background:var(--bg-color); padding:10px; border-radius:6px; margin-bottom:8px; border:1px solid var(--border-color);">
                            <strong style="color:var(--text-bright); display:block;">${b.title}</strong>
                            <span style="font-size:12px; color:#8b949e;">CPU ID: ${b.cpu_id} | GPU ID: ${b.gpu_id}</span>
                        </div>
                    `;
                });
            }
        }

        window.onload = init;
    </script>
</body>
</html>
